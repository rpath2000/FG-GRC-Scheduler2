# Generated by the SHIFT scaffold so `alembic upgrade head` works on a fresh clone.
#
# The DEPLOY does not read this file -- it synthesises its own config inside the container,
# with absolute paths, because a generated ini is only valid from the directory it was
# written for. This exists for a human running the app locally.
[alembic]
# %(here)s is this file's own directory, so the path holds whatever directory alembic is
# invoked from. A bare relative path only works from the repo root.
script_location = %(here)s/app/models/migrations
# env.py imports the application's models, so the repo root has to be on sys.path.
prepend_sys_path = .

# No sqlalchemy.url on purpose: env.py reads DATABASE_URL, which is the one place that value
# is owned. Setting it here would be a second source of truth for it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
